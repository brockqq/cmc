# Test-only overrides, applied on top of the main application.properties for every test context.
# Every MockMvc request comes from 127.0.0.1, so the per-IP limits would trip across the suite;
# the per-account limits are left as in production and tested.
app.rate-limit.login-failures-per-ip=100000
app.rate-limit.registrations-per-ip=100000
