spring.application.name=backend

# Without an explicit profile the app runs with development defaults (application-dev.properties).
# In production run with SPRING_PROFILES_ACTIVE=prod (or any profile other than dev): the JWT secret and the
# initial admin password must then come from the environment, or startup fails.
spring.profiles.default=dev
server.port=8080

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:katadb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# JWT (HS256). Base64-encoded secret of at least 256 bits, required (APP_JWT_SECRET).
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration=PT2H

# Initial admin account, created on startup if missing. The password is required when it has to be created.
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.email=${APP_ADMIN_EMAIL:admin@example.com}
app.admin.password=${APP_ADMIN_PASSWORD:}

# Time zone used for recurring events when the client does not send one
app.default-time-zone=Asia/Taipei

# Uploaded files (petty cash receipts); override via APP_UPLOAD_DIR in production
app.upload-dir=${APP_UPLOAD_DIR:./data/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Brute-force protection for /api/auth (in memory, per server instance)
app.rate-limit.login-window=PT15M
# failed logins allowed per account from one IP, per IP overall, and per account from all IPs
app.rate-limit.login-failures-per-account-and-ip=5
app.rate-limit.login-failures-per-ip=20
app.rate-limit.login-failures-per-account=50
app.rate-limit.registration-window=PT1H
app.rate-limit.registrations-per-ip=10
